# rime-shell idle daemon config (hypridle).
#
# The commands below name the shell by its Rime OS path, /usr/share/rime-shell.
# hypridle runs each one through /bin/sh and expands nothing itself, and
# quickshell finds a running instance by the exact path it was started with, so
# this must be the same literal path the session gives `quickshell -c`.
# A packager that installs the shell elsewhere rewrites this one path at build
# time (the Rime NixOS package does); dots-extra/install-arch.sh renders a copy
# into ~/.config/hypr/hypridle.conf with the checkout's path instead.
#
# Suspend/lock commands use elogind's loginctl (works on Void; on systemd
# distros loginctl is provided by systemd and behaves the same).
# Caffeine (QuickSettings) inhibits all of this with a logind `idle` block
# inhibitor, held on every compositor — no config change is needed here.
# hypridle honours that lock (measured: held -> no listener fires; released ->
# they fire). The shell ALSO holds a Wayland surface inhibitor, but Hyprland
# ignores those on layer-shell surfaces, so on Hyprland the logind lock is the
# only thing stopping this file. See tests/measure-idle-inhibit.sh.

general {
    # rime-shell's own lock screen (WlSessionLock + PAM), via shell IPC.
    lock_cmd = qs -c /usr/share/rime-shell ipc call lockscreen lock
    # Lock before the machine suspends (fires on loginctl suspend too).
    before_sleep_cmd = loginctl lock-session
    # Wake the display on resume so no extra keypress is needed.
    # DpmsControl.sh resolves the display-power command from the compositor
    # adapter — hyprctl on Hyprland, `niri msg action power-*-monitors` on niri,
    # `wlopm` on labwc — so this one file works under all three.
    after_sleep_cmd = /usr/share/rime-shell/src/scripts/DpmsControl.sh on
}

# 5 min — dim the backlight (restored on activity).
listener {
    timeout = 300
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# 5.5 min — lock the session (elogind emits Lock → lock_cmd above).
listener {
    timeout = 330
    on-timeout = loginctl lock-session
}

# 6 min — display off. DpmsControl.sh covers Hyprland, niri and labwc.
listener {
    timeout = 360
    on-timeout = /usr/share/rime-shell/src/scripts/DpmsControl.sh off
    on-resume = /usr/share/rime-shell/src/scripts/DpmsControl.sh on
}

# 15 min — suspend.
listener {
    timeout = 900
    on-timeout = loginctl suspend
}
